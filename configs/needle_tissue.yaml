# Needle lifting from soft tissue with a stereo endoscope, MV-MAE + DrQ-v2.
# Every key here is optional; missing keys use the defaults in config.py.
# Override from the command line as section.key=value, e.g. env.num_envs=16.

env:
  num_envs: 32
  sim_dt: 0.005          # 200 Hz physics
  decimation: 8          # -> 25 Hz control
  episode_length_s: 5.0  # 125 control steps
  tissue_size: [0.10, 0.10, 0.01]
  tissue_youngs_modulus: 5.0e+4
  tissue_poissons_ratio: 0.45
  needle_asset: sdf      # sdf | mesh
  goal_height: 0.04      # fixed goal 4 cm above the tissue centre
  lift_height: 0.02
  success_threshold: 0.02
  ik_pos_scale: 0.005    # metres per step at action = 1
  ik_rot_scale: 0.05     # radians per step at action = 1

camera:
  width: 96
  height: 96
  baseline: 0.005        # 5 mm between the eyes
  look_at_height: 0.035  # look-at point above the tissue top
  distance: 0.17
  azimuth_deg: 45.0
  elevation_deg: 35.0

mvmae:
  frame_stack: 3
  patch_size: 16
  embed_dim: 256
  encoder_depth: 8
  decoder_depth: 6
  mask_ratio: 0.95

agent:
  batch_size: 256
  lr: 1.0e-4
  encoder_lr: 1.0e-4
  nstep: 3
  gamma: 0.99
  stddev_schedule: linear(1.0,0.1,1000000)
  mae_coef: 1.0
  bc_coef: 0.4

train:
  total_env_steps: 2000000
  seed_env_steps: 10000
  mae_pretrain_updates: 2000
  updates_per_env_step: 0.25
  replay_capacity: 100000   # ~5.5 GB of images; lower it on a 24 GB GPU if memory runs out
  replay_device: cuda
  demo_path: ""             # e.g. demos/needle_demos.pt from record_demos.py
  demo_ratio: 0.25
  eval_every_env_steps: 50000

log:
  wandb_project: mvmae-drqv2-surgery
  wandb_mode: online        # online | offline | disabled
  log_every_updates: 250
  recon_every_updates: 5000
